name: Retrain quant model

on:
  schedule:
    # Daily at 21:23 UTC = 05:23 HKT, after the results dataset's usual
    # post-matchday update and before the HK morning.
    - cron: "23 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Train model on latest results
        run: npx -y tsx scripts/quant-train.ts

      - name: Commit updated artifacts
        run: |
          if git diff --ignore-matching-lines='^[[:space:]]*"(trainedAt|evaluatedAt)"' --quiet lib/quant/data; then
            echo "Only artifact timestamps changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/quant/data
          git commit -m "Retrain quant model (scheduled)"
          git push
